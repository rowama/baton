id: recipe-builder
version: 5
format: baton-recipe/1
capabilities_vocab: baton-capabilities/1
description: Turn a described process into a validated recipe the owner approves (a flower bed, a client onboarding, a product launch), or, when a full process is not worth it, into a guide for a quick run.
scope:
  covers: ["a process described in a sentence", "specializing an existing recipe for a narrower or wider set of jobs"]
  not_for:
    - { job: "changing a recipe during a live run" }
    - { job: "publishing a recipe to a public catalog" }
  varies_by: ["whether it has a choice of implementation to settle first", "how many kinds of worker the process needs", "whether it touches money, law or things that cannot be undone"]
parent: null

run_inputs:
  schema: schemas/run_inputs.json        # title, idea, profile?, base_recipe?

defaults:
  max_attempts: 3

complexity:
  axes:
    approach: { scale: [quick, simple, standard, complex], confirm_lowest: true }   # how much process the builder adds; quick: a guide, not a process (Decision 0163)
    software: { scale: [none, simple] }                # the most software the builder may write (Decision 0155; engineered comes later)
  triage_step: profile

steps:
  - id: profile
    title: Understand the process
    requires: { capabilities: [structured_output, long_form_writing, technical_reasoning, workspace_read], tier: strong }
    workspace: read                       # reads recipes/plans/ for an earlier process plan (Decision 0102)
    prompt: prompts/profile.md
    inputs:
      - { name: idea,        from: run.inputs.idea,        required: true }
      - { name: profile,     from: run.inputs.profile,     required: false }
      - { name: base_recipe, from: run.inputs.base_recipe, required: false }
      - { name: recipes,     from: catalog.summaries,      required: false }
      - { name: guides,      from: catalog.guides,         required: false }   # for a quick run instead (Decision 0145)
    output_schema: schemas/profile_out.json
    artifacts:
      - { name: process_plan, required: false, media_type: text/markdown,
          publish: { to: "recipes/plans/{{ run.slug }}.md" } }
    gates: [ { type: schema } ]          # every rating waits on the owner (confirm_lowest), so the ratings' approval is the one question here (Decision 0163)

  - id: guide
    title: Choose or write the guide for a quick run
    depends_on: [profile]
    applies_to: { approach: [quick] }
    requires: { capabilities: [structured_output, long_form_writing], tier: strong }
    prompt: prompts/guide.md
    inputs:
      - { name: idea,    from: run.inputs.idea,      required: true }
      - { name: profile, from: steps.profile.output, required: true }
      - { name: guides,  from: catalog.guides,       required: true }
    output_schema: schemas/guide_out.json
    artifacts:
      - { name: guide, required: true, media_type: text/markdown,
          publish: { to: "guides/{{ run.slug }}.md" } }
    gates:
      - { type: schema }
      - { type: script, run: "baton guides check --artifact guide", timeout_s: 60 }
      - { type: human, prompt: "Use this guide?",
          labels: { approve: "Yes, use it", reject: "Change something first" } }

  - id: research
    title: Learn how this work is usually done and the ways to do it
    depends_on: [profile]
    applies_to: { approach: [standard, complex] }   # a choice that shapes the process makes the approach at least standard (the profile schema enforces it)
    requires: { capabilities: [structured_output, long_form_writing, web_access], tier: strong }
    prompt: prompts/research.md
    inputs:
      - { name: profile, from: steps.profile.output, required: true }
    output_schema: schemas/research_out.json
    gates: [ { type: schema } ]

  - id: shape
    title: Design and audit the process
    depends_on: [profile, research]       # a skipped research counts as satisfied
    applies_to: { approach: [simple, standard, complex] }   # the full process; quick requires software: none (the profile schema)
    repeat_until: group.steps.audit.gates.passed
    repeat_from: design
    max_iterations: 3
    steps:
      - id: design
        title: Design the process
        requires: { capabilities: [structured_output, long_form_writing, technical_reasoning], tier: strong }
        prompt: prompts/design.md
        inputs:
          - { name: profile,       from: steps.profile.output,              required: true }
          - { name: research,      from: steps.research.output,             required: false }
          - { name: open_findings, from: group.previous_iteration.findings, required: false }
          - { name: patterns,      from: static.patterns.md,                required: true }
        output_schema: schemas/design_out.json
        artifacts:
          - { name: design_doc, required: true, media_type: text/markdown }
        gates: [ { type: schema } ]
      - id: audit
        title: Audit the design
        depends_on: [design]
        requires: { capabilities: [structured_output, technical_reasoning], tier: strong }
        independence: { from_step: design, level: different_vendor }
        prompt: prompts/audit.md
        inputs:
          - { name: design,   from: group.steps.design.output,            required: true }
          - { name: document, from: group.steps.design.artifacts.design_doc, required: true }
          - { name: rubric,   from: static.readiness.md,                  required: true }
          - { name: patterns, from: static.patterns.md,                   required: true }
        output_schema: baton:findings
        gates:
          - { type: findings, block_on: [critical, high] }
          - { type: human, applies_to: { approach: [standard, complex], software: [simple] },   # the owner sees any software before it is built
              prompt: "Is this the process you want? Saying no sends it back with your note." }

  - id: generate
    title: Build the recipe package
    depends_on: [shape]
    applies_to: { approach: [simple, standard, complex] }
    requires: { capabilities: [structured_output, file_write, shell, repo_workspace], tier: strong }
    workspace: write
    prompt: prompts/generate.md
    inputs:
      - { name: shaped,  from: steps.shape.outputs, required: true }
      - { name: profile, from: steps.profile.output, required: true }
    output_schema: schemas/generate_out.json
    artifacts:
      - { name: walkthrough, required: true, media_type: text/markdown }
      - { name: ledger,      required: true, media_type: application/json }
    gates:
      - { type: schema }
      - { type: script, run: "baton plan recipes/drafts/{{ run.slug }}", timeout_s: 120 }
      - { type: script, run: "baton recipe check recipes/drafts/{{ run.slug }} --ledger recipes/drafts/{{ run.slug }}.ledger.json --require-discovery", timeout_s: 60 }
      - { type: script, run: "baton programs test recipes/drafts/{{ run.slug }} --require-examples", timeout_s: 600 }   # every tool passes its worked examples (Decision 0162)
      - type: review
        applies_to: { approach: [complex], software: [simple] }   # software written for the process is always reviewed
        block_on: [critical, high]
        reviewer_requires: { capabilities: [structured_output, technical_reasoning, workspace_read], tier: strong }
        independence: { from_step: generate, level: different_vendor }
        rubric: prompts/package_review_rubric.md

  - id: accept
    title: Owner approves the finished process
    depends_on: [generate]
    applies_to: { approach: [simple, standard, complex] }
    requires: { capabilities: [human_judgment] }
    prompt: prompts/accept.md
    inputs:
      - { name: walkthrough, from: steps.generate.artifacts.walkthrough, required: true }
    output_schema: schemas/accept_out.json
    gates:
      - { type: schema }
      - { type: human, prompt: "Use this process?",
          labels: { approve: "Yes, use it", reject: "Change something first" } }
