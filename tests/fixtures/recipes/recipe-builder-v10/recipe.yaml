id: recipe-builder
version: 10
format: baton-recipe/1
capabilities_vocab: baton-capabilities/1
description: Turn a described process into a validated recipe the owner approves (a flower bed, a client onboarding, a product launch), or, when a full process is not worth it, into a guide for a quick run.
scope:
  covers: ["a process described in a sentence", "specializing an existing recipe for a narrower or wider set of jobs"]
  not_for:
    - { job: "changing a recipe during a live run" }
    - { job: "publishing a recipe to a public catalog" }
  varies_by: ["whether it has a choice of implementation to settle first", "how many kinds of worker the process needs", "whether it touches money, law or things that cannot be undone"]
parent: null

run_inputs:
  schema: schemas/run_inputs.json        # title, idea, profile?, base_recipe?

project_inputs:
  - role: examples
    description: "The owner's examples for the programs to be built: for each one, the files it is given and the result expected, one folder per example under examples/ in the project"
    required: false
    many: true
  - role: context
    description: "Documents of how the owner works now, such as a procedures manual, a checklist or an earlier process, for the builder to learn from"
    required: false
    many: true

defaults:
  max_attempts: 3

complexity:
  axes:
    approach: { scale: [quick, simple, standard, complex], confirm_lowest: true }   # how much process the builder adds; quick: a guide, not a process (Decision 0163)
    software: { scale: [none, simple, engineered] }    # the most software the builder may write (Decisions 0155, 0164)
  triage_step: profile

steps:
  - id: profile
    effect: none   # reads the project; writes nothing but its result (Decision 0182, item 5)
    repeatable: true          # safe to evaluate again: a shadow attempt may shadow it (Decision 0179, item 6)
    title: Understand the process
    requires: { capabilities: [structured_output, long_form_writing, technical_reasoning, workspace_read], tier: strong }
    workspace: read                       # reads recipes/plans/ for an earlier process plan (Decision 0102)
    prompt: prompts/profile.md
    inputs:
      - { name: idea,        from: run.inputs.idea,        required: true }
      - { name: profile,     from: run.inputs.profile,     required: false }
      - { name: base_recipe, from: run.inputs.base_recipe, required: false }
      - { name: context,     from: project.context,        required: false }   # how the owner works now (Decision 0173)
      - { name: recipes,     from: catalog.summaries,      required: false }
      - { name: guides,      from: catalog.guides,         required: false }   # for a quick run instead (Decision 0145)
    output_schema: schemas/profile_out.json
    artifacts:
      - { name: process_plan, required: false, media_type: text/markdown,
          publish: { to: "recipes/plans/{{ run.slug }}.md" } }
    gates: [ { type: schema } ]          # every rating waits on the owner (confirm_lowest), so the ratings' approval is the one question here (Decision 0163)

  - id: guide
    effect: none
    title: Choose or write the guide for a quick run
    depends_on: [profile]
    applies_to: { approach: [quick] }
    requires: { capabilities: [structured_output, long_form_writing], tier: standard }   # adopt, adapt or write a short guide (0181)
    prompt: prompts/guide.md
    inputs:
      - { name: idea,    from: run.inputs.idea,      required: true }
      - { name: profile, from: steps.profile.output, required: true }
      - { name: guides,  from: catalog.guides,       required: true }
    output_schema: schemas/guide_out.json
    artifacts:
      - { name: guide, required: true, media_type: text/markdown,
          publish: { to: "guides/{{ run.slug }}.md" } }
    gates:
      - { type: schema }
      - { type: script, run: "baton guides check --artifact guide", timeout_s: 60 }
      - { type: human, prompt: "Use this guide?",
          labels: { approve: "Yes, use it", reject: "Change something first" } }

  - id: research
    title: Learn how this work is usually done and the ways to do it
    depends_on: [profile]
    applies_to: { approach: [standard, complex] }   # a choice that shapes the process makes the approach at least standard (the profile schema enforces it)
    requires: { capabilities: [structured_output, long_form_writing, web_access], tier: strong }
    prompt: prompts/research.md
    inputs:
      - { name: profile, from: steps.profile.output, required: true }
      - { name: context, from: project.context,      required: false }
    output_schema: schemas/research_out.json
    gates: [ { type: schema } ]

  - id: shape
    title: Design and audit the process
    depends_on: [profile, research]       # a skipped research counts as satisfied
    applies_to: { approach: [simple, standard, complex] }   # the full process; quick requires software: none (the profile schema)
    repeat_until: group.steps.audit.gates.passed
    repeat_from: design
    max_iterations: 3
    steps:
      - id: design
        effect: none
        repeatable: true          # safe to evaluate again: a shadow attempt may shadow it (Decision 0179, item 6)
        title: Design the process
        requires: { capabilities: [structured_output, long_form_writing, technical_reasoning], tier: strong }
        prompt: prompts/design.md
        inputs:
          - { name: profile,       from: steps.profile.output,              required: true }
          - { name: research,      from: steps.research.output,             required: false }
          - { name: context,       from: project.context,                   required: false }
          - { name: open_findings, from: group.previous_iteration.findings, required: false }
          - { name: patterns,      from: static.patterns.md,                required: true }
        output_schema: schemas/design_out.json
        artifacts:
          - { name: design_doc, required: true, media_type: text/markdown }
        gates:
          - { type: schema }
          - { type: script, run: "baton recipe check-guesses --result", timeout_s: 60 }   # a choice that is the owner's is asked, never guessed (Decision 0186)
      - id: audit
        effect: none
        repeatable: true          # safe to evaluate again: a shadow attempt may shadow it (Decision 0179, item 6)
        title: Audit the design
        depends_on: [design]
        requires: { capabilities: [structured_output, technical_reasoning], tier: strong }
        independence: { from_step: design, level: different_vendor }
        prompt: prompts/audit.md
        inputs:
          - { name: design,   from: group.steps.design.output,            required: true }
          - { name: document, from: group.steps.design.artifacts.design_doc, required: true }
          - { name: rubric,   from: static.readiness.md,                  required: true }
          - { name: patterns, from: static.patterns.md,                   required: true }
        output_schema: baton:findings
        gates:
          - { type: findings, block_on: [critical, high] }
          - { type: human, applies_to: { approach: [standard, complex], software: [simple, engineered] },   # the owner sees any software before it is built
              prompt: "Is this the process you want? Saying no sends it back with your note." }

  - id: generate
    effect: reversible   # writes the draft recipe under recipes/drafts/, kept in git
    title: Build the recipe package
    depends_on: [shape]
    applies_to: { approach: [simple, standard, complex] }
    requires: { capabilities: [structured_output, file_write, shell, repo_workspace], tier: standard }   # translates the approved design; its package review stays strong (0181)
    workspace: write
    prompt: prompts/generate.md
    inputs:
      - { name: shaped,  from: steps.shape.outputs, required: true }
      - { name: profile, from: steps.profile.output, required: true }
    output_schema: schemas/generate_out.json
    artifacts:
      - { name: walkthrough, required: true, media_type: text/markdown }
      - { name: ledger,      required: true, media_type: application/json }
    gates:
      - { type: schema }
      - { type: script, run: "baton plan recipes/drafts/{{ run.slug }}", timeout_s: 120 }
      - { type: script, run: "baton recipe check recipes/drafts/{{ run.slug }} --ledger recipes/drafts/{{ run.slug }}.ledger.json --require-discovery", timeout_s: 60 }
      - { type: script, run: "baton programs test recipes/drafts/{{ run.slug }} --require-examples --allow-unbuilt", timeout_s: 600 }   # every simple program passes its worked examples (Decision 0162); engineered ones are built later
      - type: review
        applies_to: { approach: [complex], software: [simple, engineered] }   # software written for the process is always reviewed
        block_on: [critical, high]
        reviewer_requires: { capabilities: [structured_output, technical_reasoning, workspace_read], tier: strong }
        independence: { from_step: generate, level: different_vendor }
        rubric: prompts/package_review_rubric.md

  - id: example_plan
    title: Choose how each program's examples will come
    depends_on: [generate]
    applies_to: { software: [engineered] }
    requires: { capabilities: [human_judgment] }
    prompt: prompts/example_plan.md
    inputs:
      - { name: shaped,    from: steps.shape.outputs,    required: true }
      - { name: generated, from: steps.generate.output, required: true }
    output_schema: schemas/example_plan_out.json
    gates: [ { type: schema } ]

  - id: examples
    effect: reversible
    title: Place the examples each program will be built to
    depends_on: [example_plan]
    applies_to: { software: [engineered] }
    requires: { capabilities: [structured_output, file_write, repo_workspace], tier: standard }   # places the examples the design names (0181)
    workspace: write
    prompt: prompts/examples.md
    inputs:
      - { name: plan,      from: steps.example_plan.output, required: true }
      - { name: shaped,    from: steps.shape.outputs,       required: true }
      - { name: generated, from: steps.generate.output,     required: true }
      - { name: owner_examples, from: project.examples,     required: false }   # the owner's files, bound by role (Decision 0164, item 1)
    output_schema: schemas/examples_out.json
    gates:
      - { type: schema }
      - { type: script, run: "baton programs examples recipes/drafts/{{ run.slug }} --run {{ run.id }}", timeout_s: 60 }   # enough examples, the owner's copied exactly
      - { type: human, prompt: "Build the programs to these examples?",
          labels: { approve: "Yes, build to these", reject: "Change an example first" } }

  - id: build_programs
    title: Build each program to its examples
    depends_on: [examples]
    applies_to: { software: [engineered] }
    foreach: steps.generate.output.engineered_programs   # one instance per engineered program, built one at a time
    foreach_if_source_skipped: skip
    concurrency: 1
    repeat_until: group.steps.review.gates.passed
    repeat_from: implement
    max_iterations: 3                    # at the limit the owner chooses: retry with a note, simplify (revise generate) or stop
    steps:
      - id: implement
        effect: reversible
        title: Build the program to its examples
        requires: { capabilities: [structured_output, file_write, shell, repo_workspace], tier: standard }   # built to fixed examples and reviewed independently (0181)
        workspace: write
        independence: { from_step: examples, level: different_vendor }   # not the worker that placed the examples (Decision 0164, item 4)
        protect: { paths: ["recipes/drafts/**/programs/*/examples/**"], on_violation: fail }   # the examples are never changed to fit the code
        prompt: prompts/implement.md
        inputs:
          - { name: program,          from: item,                              required: true }
          - { name: shaped,        from: steps.shape.outputs,               required: true }
          - { name: generated,     from: steps.generate.output,             required: true }
          - { name: open_findings, from: group.previous_iteration.findings, required: false }
        output_schema: schemas/implement_out.json
        gates:
          - { type: schema }
          - { type: script, run: "baton programs test recipes/drafts/{{ run.slug }} --program {{ item.program }} --repeat 2 --require-examples", timeout_s: 1200 }
          - { type: script, run: "baton recipe check recipes/drafts/{{ run.slug }} --ledger recipes/drafts/{{ run.slug }}.ledger.json", timeout_s: 60 }   # the program budget
      - id: review
        effect: none
        repeatable: true          # safe to evaluate again: a shadow attempt may shadow it (Decision 0179, item 6)
        title: Review the program against its contract
        depends_on: [implement]
        requires: { capabilities: [structured_output, technical_reasoning, workspace_read], tier: strong }
        workspace: read
        independence: { from_step: implement, level: different_vendor }
        prompt: prompts/program_review.md
        inputs:
          - { name: program,   from: item,                          required: true }
          - { name: built,  from: group.steps.implement.output,  required: true }
          - { name: rubric, from: static.program_review_rubric.md,  required: true }
        output_schema: baton:findings
        gates: [ { type: findings, block_on: [critical, high] } ]

  - id: accept
    title: Owner approves the finished process
    depends_on: [generate, examples, build_programs]   # a skipped step or group counts as satisfied
    applies_to: { approach: [simple, standard, complex] }
    requires: { capabilities: [human_judgment] }
    prompt: prompts/accept.md
    inputs:
      - { name: walkthrough, from: steps.generate.artifacts.walkthrough, required: true }
      - { name: programs,       from: steps.build_programs.outputs,             required: false }   # each engineered program's result
    output_schema: schemas/accept_out.json
    gates:
      - { type: schema }
      - { type: human, prompt: "Use this process?",
          labels: { approve: "Yes, use it", reject: "Change something first" } }
