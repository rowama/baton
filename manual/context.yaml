# Where each topic opens from (§13.10).
#   ui:       the setup page's help controls (data-help ids) -> the topic and section they open. A provider's own card opens its
#             generated page (providers.<name>), which the page names directly.
#   errors:   a refusal's code -> the topic that explains it, so the page and the CLI point at the same words.
#   commands: the topic a CLI command's --help names.
# `pending_commands` are commands whose topic is not written yet; the list only shrinks, and is empty when the manual is complete.
ui:
  ui.subscriptions: user.connect-a-subscription#here-now
  ui.subscriptions.not-ready: user.connect-a-subscription#not-ready
  ui.accounts: user.connect-an-account#here-now
  ui.models: user.choose-models#here-now
  ui.models.table: user.choose-models#reading-the-table
  ui.models.capabilities: user.choose-models#likely-verified-absent
  ui.models.prefer: user.choose-models#prefer-a-model
errors:
  accounts.key_refused: user.connect-an-account#key-refused
  accounts.no_key: user.connect-an-account#here-now
  accounts.key_from_environment: admin.secrets#where-keys-are-kept
