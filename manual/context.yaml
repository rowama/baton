# Where each topic opens from (§13.10). `ui`: the setup page's data-help ids. `commands`: the topic a command's --help names.
# `pending_commands` are commands whose topic is not written yet; the list only shrinks, and is empty when the manual is complete.
ui:
  ui.accounts: user.connect-an-account#here-now
  ui.accounts.key-refused: user.connect-an-account#key-refused
  ui.subscriptions: user.connect-a-subscription#here-now
  ui.models: user.choose-models#here-now
commands:
  ui: user.connect-an-account
  workers: user.connect-an-account
  help: user.choose-models
pending_commands: [abandon, adopt, ask-sme, board, cancel, check, decide, detect, diag, dispatch, disposition, doctor, eligible, establish-baseline, explain, feedback, frame, ingest-revision, init, lease, mcp, migrate, note, permission, plan, platform-fact, platform-incident, promote-sme, push, recipe, recipes, record, resume, retriage, retry, revise, sme, sme-eligible, sme-followup, sme-handoff, start, status, submit, summary, trace, upgrade, vendor, wait, waive]
