id: fit-check
version: 5
format: baton-recipe/1
capabilities_vocab: baton-capabilities/1
description: Decide in minutes whether the work an owner asks for suits Baton, before investing in it.

run_inputs:
  schema: schemas/run_inputs.json      # title, idea, context (optional)

steps:
  - id: describe
    title: Profile the idea
    requires: { capabilities: [structured_output, long_form_writing], tier: standard }
    prompt: prompts/describe.md
    inputs:
      - { name: idea, from: run.inputs.idea, required: true }
      - { name: context, from: run.inputs.context, required: false }
    output_schema: schemas/profile.json
    gates: [ { type: schema } ]

  - id: assess
    title: Score against the fit rubric
    depends_on: [describe]
    requires: { capabilities: [structured_output, technical_reasoning], tier: standard }
    prompt: prompts/assess.md
    inputs:
      - { name: profile, from: steps.describe.output, required: true }
      - { name: rubric,  from: static.rubric.md,      required: true }
      - { name: recipes, from: catalog.summaries,     required: false }
      - { name: context, from: run.inputs.context,    required: false }
    output_schema: schemas/verdict.json
    gates:
      - { type: schema }
      - { type: human, prompt: "Accept this verdict and its suggested next step?",
          labels: { approve: "That verdict sounds right", reject: "I don't think that's right" } }
