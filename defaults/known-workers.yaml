  # Tool maps (0085): the args that turn a tooling capability on. Entered by
  # hand from the installed CLIs' --help (claude 2.1.319, codex-cli 0.166.0)
  # until the first research run under 2026-11-cli-model-routes replaces them.
  # The other tooling capabilities come from the adapters' permission and
  # sandbox modes (§6.3).
  # Research 2026-11-08 read the docs only (no CLI was run): the web_access
  # maps are unchanged; no documented flag was found that switches shell,
  # file_write, code_exec, repo_workspace or workspace_read on (they are the
  # adapters' permission/sandbox modes), so no further tools entries.
  # Machine-readable events: --output-format stream-json (with --verbose).
  claude_code:
    kind: harness
    creators: [anthropic]
    env_deny: [ANTHROPIC_API_KEY]
    sources:
      - { url: "https://code.claude.com/docs/en/model-config.md", retrieved: 2026-11-08 }
      - { url: "https://code.claude.com/docs/en/cli-reference.md", retrieved: 2026-11-08 }
    tools:
      web_access:
        args: ["--allowedTools", "WebSearch,WebFetch"]
        flag: "--allowedTools"
        off_args: ["--disallowedTools", "WebSearch,WebFetch"]
        evidence: [WebSearch, WebFetch]
        versions: "2.1.319"
        sources:
          - { url: "https://code.claude.com/docs/en/cli-reference.md", retrieved: 2026-11-08 }
        note: "--allowedTools pre-approves the tools, so print mode does not deny them; --disallowedTools removes them from steps that do not need the web."
  # Machine-readable events: codex exec --json.
  codex:
    kind: harness
    creators: [openai]
    env_deny: [OPENAI_API_KEY, CODEX_API_KEY]
    sources:
      - { url: "https://learn.chatgpt.com/docs/models", retrieved: 2026-11-08 }
      - { url: "https://learn.chatgpt.com/docs/developer-commands?surface=cli", retrieved: 2026-11-08 }
    tools:
      web_access:
        args: ["--search"]
        position: before_subcommand   # `codex exec --search` is rejected; `codex --search exec` parses
        flag: "--search"
        evidence: [web_search]
        versions: "0.166.0"
        sources:
          - { url: "https://learn.chatgpt.com/docs/developer-commands?surface=cli", retrieved: 2026-11-08 }
        note: "Web search is off unless --search is given (docs: sets web_search = live instead of the default cached). [VERIFY] that exec honours the top-level flag; the first observed use records it."

