# Known workers (baton-known-workers/1; §6.4, Decision 0080).
#
# Shared, read-only data about models and the routes that reach them. The
# worker resource manager (`baton workers setup`) turns supported routes into
# profiles; it never changes this file. Maintainers update it with
# baton-worker-research (tools/worker-research/) and review the change.
#
# sources / researched: what research found, with where and when.
# verified:             only an actual live check (date, tool, version).
# This seed was researched on 2026-11-06; no route has been live-verified.
# Capabilities and tiers are the maintainer's judgment from the sources.
# Research update 2026-11-08: harness routes for claude_code and codex added
# from their docs; no other provider re-researched (see report coverage gaps).
# Research update 2026-11-06 (run r_20261107_b862): added models and routes
# across creators and categories; still no route is live-verified.
# LiteLLM prefixes and key variables below come from the LiteLLM docs, with
# litellm 1.108.2 (PyPI, released 2026-11-06) the latest release seen.
format: baton-known-workers/1

# Never listed below: they depend on the machine (0082).
machine_dependent: [loopback_network]

