[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "baton"
version = "0.1.0"
description = "Vendor-neutral, Director-led multi-step process framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",      # format models; emits the published JSON Schema (§15.3)
    "jsonschema>=4.18",   # validates recipe schemas as Draft 2020-12 (§5.3)
    "pyyaml>=6",          # recipe.yaml, vocabularies, profiles
    "jinja2>=3.1",        # template variables in publish.to; later INSTRUCTIONS.md and templates
    "typer>=0.12",        # CLI
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6"]  # hypothesis: property tests (§17)

[project.scripts]
baton = "baton.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/baton"]

# Data lives at the repo root (§4.1) and is shipped inside the package.
[tool.hatch.build.targets.wheel.force-include]
"vocab" = "baton/_data/vocab"
"formats" = "baton/_data/formats"
"defaults" = "baton/_data/defaults"

[tool.pytest.ini_options]
testpaths = ["tests"]
