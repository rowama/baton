[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "baton"
version = "0.1.0"
description = "Vendor-neutral, Director-led multi-step process framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",      # format models; emits the published JSON Schema (§15.3)
    "jsonschema>=4.18",   # validates recipe schemas as Draft 2020-12 (§5.3)
    "pyyaml>=6",          # recipe.yaml, vocabularies, profiles
    "jinja2>=3.1",        # template variables in publish.to; later INSTRUCTIONS.md and templates
    "typer>=0.12",        # CLI
]

[project.optional-dependencies]
api = ["litellm>=1.70"]  # the litellm_api adapter (§6.3); imported only by the worker child
keyring = ["keyring>=25"]  # optional OS-keyring secret store (§6.1)
mcp = ["mcp>=2.3,<3", "uvicorn>=0.30"]  # `baton mcp` (§13.2): stdio, or HTTP for Directors without a shell
dev = ["pytest>=8", "pytest-xdist>=3.5", "pytest-testmon>=2.1", "hypothesis>=6", "litellm>=1.70", "mcp>=2.3,<3", "uvicorn>=0.30"]  # hypothesis: property tests (§17)

[project.scripts]
baton = "baton.launcher:main"  # the launcher (§14.1), then the CLI

[tool.hatch.build.targets.wheel]
packages = ["src/baton"]

# Data lives at the repo root (§4.1) and is shipped inside the package.
[tool.hatch.build.targets.wheel.force-include]
"vocab" = "baton/_data/vocab"
"formats" = "baton/_data/formats"
"defaults" = "baton/_data/defaults"
"classify" = "baton/_data/classify"
"builtin" = "baton/_data/builtin"
"skills" = "baton/_data/skills"
"examples" = "baton/_data/examples"
"ui" = "baton/_data/ui"
"manual" = "baton/_data/manual"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "slow: spawns Baton processes, waits on real time, or measured over 1 s on the baseline; left out of the quick gate only (§17)",
    "not_slow(reason): in a process-spawning test file but quick; the reason says why",
]
